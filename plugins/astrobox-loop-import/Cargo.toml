[workspace]

[package]
name = "astrobox-plugin-loop-import"
version = "0.3.1"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "0.63.0", features = ["async", "async-spawn"] }
loop-protocol = { path = "../../crates/loop-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
